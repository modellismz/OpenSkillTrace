services:
  openskilltrace:
    build:
      context: .
    container_name: openskilltrace
    ports:
      - "8000:8000"
    env_file:
      - path: .env.example
        required: true
      - path: .env.local
        required: false
    environment:
      OST_DATABASE_PATH: /app/data/openskilltrace.json
      OST_CORS_ORIGINS: http://localhost:8000
    volumes:
      - ./data:/app/data
    restart: unless-stopped
